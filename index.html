<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pico Aventura</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; min-height: 100vh; background: #1b1530; color: #f3e9d2; font-family: "Trebuchet MS", system-ui, sans-serif; display: grid; place-items: center; }
main { width: min(100%, 820px); padding: 12px; text-align: center; }
h1 { margin: 0 0 10px; font-size: 1.6rem; letter-spacing: 1px; }
canvas { width: 100%; height: auto; display: block; border: 4px solid #f3e9d2; border-radius: 8px; background: #6ec6ff; image-rendering: pixelated; }
.help { font-size: .85rem; opacity: .75; }
.pad { display: none; justify-content: space-between; align-items: center; margin-top: 8px; }
.pad button { font-size: 1.3rem; width: 78px; height: 64px; margin-right: 8px; border: 0; border-radius: 12px; background: #f3e9d2; color: #1b1530; font-weight: 700; touch-action: none; }
.pad .jump { width: 120px; margin: 0; background: #ffb347; }
.pad button:active { transform: scale(.95); }
@media (pointer: coarse) { .pad { display: flex; } }
</style>
</head>
<body>
<main>
  <h1>Pico Aventura</h1>
  <canvas id="game" width="640" height="384"></canvas>
  <p class="help">Mover: ← → o A D · Saltar: ↑, W o Espacio · Pisa a los enemigos y llega a la bandera</p>
  <div class="pad">
    <div><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button></div>
    <button data-k="ArrowUp" class="jump">Saltar</button>
  </div>
</main>

<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const T = 32, VW = 640, VH = 384, GROUND = 10;

// Datos de cada nivel: w = ancho en bloques, gaps = huecos, plats = [x, y, largo],
// enemies = [x, y], flag = columna de la bandera
const LEVELS = [
  { w: 50, gaps: [[18, 19]], plats: [[10, 7, 3], [24, 7, 4], [34, 7, 3]], enemies: [[14, 9], [28, 9], [40, 9]], flag: 47 },
  { w: 70, gaps: [[14, 16], [30, 32], [48, 50]], plats: [[13, 7, 2], [22, 7, 3], [36, 7, 3], [40, 5, 3], [56, 7, 4]],
    enemies: [[10, 9], [24, 9], [38, 9], [44, 9], [60, 9]], flag: 67 },
  { w: 90, gaps: [[10, 12], [22, 24], [34, 36], [46, 48], [60, 62], [72, 74]],
    plats: [[9, 7, 2], [21, 7, 2], [40, 7, 2], [44, 5, 2], [58, 7, 2], [66, 7, 3], [71, 7, 2]],
    enemies: [[16, 9], [28, 9], [30, 9], [40, 9], [52, 9], [55, 9], [68, 9], [80, 9], [83, 9]], flag: 87 }
];

let lvl = 0, solid, coins, enemies, W, flagX, p, cam, score = 0, lives = 3, state = 'title', banner = 0;
const keys = {};

function load(n) {
  const L = LEVELS[n]; W = L.w * T; solid = new Set(); coins = [];
  for (let x = 0; x < L.w; x++)
    if (!L.gaps.some(g => x >= g[0] && x <= g[1])) { solid.add(x + ',10'); solid.add(x + ',11'); }
  L.plats.forEach(([px, py, len]) => {
    for (let i = 0; i < len; i++) { solid.add((px + i) + ',' + py); coins.push({ x: (px + i) * T + 16, y: (py - 1) * T + 16 }); }
  });
  L.gaps.forEach(g => { for (let x = g[0]; x <= g[1]; x++) coins.push({ x: x * T + 16, y: 8 * T }); });
  enemies = L.enemies.map(([x, y]) => ({ x: x * T + 3, y: y * T + 4, w: 26, h: 28, vx: -0.8, vy: 0, dead: false }));
  p = { x: T, y: 8 * T, w: 22, h: 28, vx: 0, vy: 0, on: false, face: 1 };
  flagX = L.flag * T; cam = 0; banner = 120;
}

function hit(x, y, w, h) {
  for (let tx = Math.floor(x / T); tx <= Math.floor((x + w - 1) / T); tx++)
    for (let ty = Math.floor(y / T); ty <= Math.floor((y + h - 1) / T); ty++)
      if (solid.has(tx + ',' + ty)) return true;
  return false;
}

function move(o) {
  o.vy = Math.min(o.vy + 0.5, 12);
  o.x += o.vx; o.wall = false;
  if (hit(o.x, o.y, o.w, o.h)) {
    o.x = o.vx > 0 ? Math.floor((o.x + o.w) / T) * T - o.w : (Math.floor(o.x / T) + 1) * T;
    o.wall = true;
  }
  o.y += o.vy; o.on = false;
  if (hit(o.x, o.y, o.w, o.h)) {
    if (o.vy > 0) { o.y = Math.floor((o.y + o.h) / T) * T - o.h; o.on = true; }
    else o.y = (Math.floor(o.y / T) + 1) * T;
    o.vy = 0;
  }
}

function die() {
  lives--;
  if (lives <= 0) state = 'over'; else load(lvl);
}

function update() {
  if (state !== 'play') return;
  const l = keys.ArrowLeft || keys.a, r = keys.ArrowRight || keys.d, j = keys.ArrowUp || keys.w || keys[' '];
  p.vx = (r ? 3.2 : 0) - (l ? 3.2 : 0);
  if (p.vx) p.face = Math.sign(p.vx);
  if (j && p.on) { p.vy = -10.5; p.on = false; }
  move(p);
  if (p.x < 0) p.x = 0;
  if (p.y > VH + 80) return die();

  enemies.forEach(e => {
    if (e.dead) return;
    move(e);
    const ahead = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
    if (e.wall || (e.on && !hit(ahead, e.y + e.h + 2, 1, 1))) e.vx *= -1;
    if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
      if (p.vy > 0 && p.y + p.h - e.y < 18) { e.dead = true; p.vy = -7; score += 100; }
      else return die();
    }
  });

  coins = coins.filter(c => {
    const got = Math.abs(c.x - (p.x + p.w / 2)) < 18 && Math.abs(c.y - (p.y + p.h / 2)) < 20;
    if (got) score += 10;
    return !got;
  });

  if (p.x + p.w > flagX && p.x < flagX + 12) {
    score += 500;
    if (lvl < LEVELS.length - 1) { lvl++; load(lvl); } else state = 'win';
  }
  cam = Math.max(0, Math.min(W - VW, p.x - VW / 2));
  if (banner > 0) banner--;
}

function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x - cam), Math.round(y), w, h); }

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#5fb8ff'); g.addCo
